<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Notely</title>
    <link rel="stylesheet" href="auth-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <!-- Theme toggle button -->
    <button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Theme">
        🌙
    </button>
    
    <div id="authLoadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Checking authentication...</p>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="landing.html" class="logo-container" style="text-decoration: none;">
                    <svg width="56" height="56" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-nn-svg-styled">
                        <defs>
                            <radialGradient id="nebulaCircle" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#a855f7"/>
                            </radialGradient>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <circle cx="26" cy="26" r="24" fill="url(#nebulaCircle)" filter="url(#glow)"/>
                        <text x="50%" y="60%" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#fff">N</text>
                    </svg>
                </a>
                <h1>Welcome Back</h1>
                <p>Sign in to access your Notely workspace</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="auth-btn primary">Sign In</button>
                </div>
                
                <div class="auth-links">
                    <a href="landing.html">← Back to Overview</a>
                    <span class="divider">|</span>
                    <a href="signup.html">Create Account</a>
                </div>
            </form>
            
            <div id="errorMessage" class="error-message hidden"></div>
        </div>
    </div>
    
    <script src="auth.js"></script>
    <script>
        const authLoadingOverlay = document.getElementById('authLoadingOverlay');
        if (authLoadingOverlay) authLoadingOverlay.style.display = 'flex';
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (authLoadingOverlay) authLoadingOverlay.style.display = 'none';
            }, 300);
        });
    </script>
</body>
</html>
